name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            binary="repo-sync"
            if [[ "$os" == "windows" ]]; then binary="repo-sync.exe"; fi
            work="dist/work_${os}_${arch}"
            mkdir -p "$work"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$work/$binary" ./cmd/repo-sync
            if [[ "$os" == "windows" ]]; then
              (cd "$work" && zip -q "../repo-sync_${version}_${os}_${arch}.zip" "$binary")
            else
              tar -C "$work" -czf "dist/repo-sync_${version}_${os}_${arch}.tar.gz" "$binary"
            fi
          done
          rm -rf dist/work_*
          (cd dist && sha256sum repo-sync_* > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
